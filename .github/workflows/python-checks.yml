name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app.py web_knowledge.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Live source smoke check (non-blocking)
        continue-on-error: true
        run: |
          python - <<'PY'
          import requests
          from web_knowledge import fetch_page, load_sources
          sources = load_sources()
          source = next(item for item in sources if item["topic"] == "EPrT")
          with requests.Session() as session:
              document = fetch_page(source, session, {})
          print(f"Official source fetched: {document['url']}; {len(document['text'])} characters")
          PY
