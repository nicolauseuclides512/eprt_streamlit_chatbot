name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app.py web_knowledge.py institutional_policy.py diagnostics.py gemini_client.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Live public source smoke check (non-blocking)
        continue-on-error: true
        run: |
          python - <<'PY'
          import requests
          from web_knowledge import fetch_page, load_sources
          failed = []
          robots_cache = {}
          with requests.Session() as session:
              for source in load_sources():
                  try:
                      document = fetch_page(source, session, robots_cache)
                      print(f"OK {source['topic']}: {document['url']} ({len(document['text'])} chars)")
                  except Exception as exc:
                      failed.append(source['url'])
                      print(f"UNAVAILABLE {source['topic']}: {type(exc).__name__} {source['url']}")
          print(f"Results: {len(load_sources()) - len(failed)} successful / {len(load_sources())} total.")
          if failed:
              raise SystemExit("Some live sources unavailable; check before production.")
          PY
